language: minimal

notifications:
  slack:
    on_success: change
    on_failure: always
    on_error: always
    on_cancel: always
    rooms:
      secure: 

services:
  - docker

env:
  - REPO=poetapp/node

before_install:
  # Print out the current docker-compose version. Once this reports 1.6+ then we
  # do not need the following steps.
  - docker-compose --version

  # As of the writing of this script Travis has docker-compose v1.4.2, we need
  # to update it to 1.8+. $DOCKER_COMPOSE_VERSION is provide from the `env`
  # above.
  - sudo rm /usr/local/bin/docker-compose
  - curl -L https://github.com/docker/compose/releases/download/${DOCKER_COMPOSE_VERSION}/docker-compose-`uname -s`-`uname -m` > docker-compose
  - chmod +x docker-compose
  - sudo mv docker-compose /usr/local/bin

  # Check that docker-compose is now running the latest version (or at least the
  # one we specified). This is not to be confused with the version we printed
  # before doing the update.
  - docker-compose --version

install:
  - docker-compose up -d
  - sleep 10

script:
  - docker-compose exec poet-node npm run lint
  - docker-compose exec poet-node npm run coverage
  - docker-compose exec poet-node npm run test:functional

after:
  - docker images

before_deploy:
  - bash ./scripts/docker-build.sh

deploy:
  - provider: script
    skip_cleanup: true
    script:
    - bash ./scripts/docker-push.sh
    on:
      all_branches: true
  - provider: script
    skip_cleanup: true
    script:
      - docker-compose exec poet-node npx semantic-release --no-ci
    on:
      branch: master
